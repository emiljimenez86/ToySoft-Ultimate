<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ToySoft Mesero</title>
  <meta name="description" content="App de mesero ToySoft para tomar pedidos en mesa">
  <meta name="theme-color" content="#0dcaf0">
  <meta name="application-name" content="ToySoft Mesero">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ToySoft Mesero">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="./image/logo-ToySoft.png">
  <link rel="apple-touch-icon" href="./image/logo-ToySoft.png">
  <link rel="manifest" href="./manifest-mesero.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #111; color: #fff; padding-bottom: 88px; }
    .mesero-top {
      position: sticky; top: 0; z-index: 20;
      background: #1a1a1a; border-bottom: 1px solid #333;
      padding: 12px 16px;
    }
    .mesa-chip {
      min-height: 76px; border-radius: 14px; border: 1px solid #333;
      background: #222; color: #fff; font-weight: 700;
    }
    .mesa-chip.ocupada { border-color: #0dcaf0; background: #12343c; }
    .mesa-chip.activa { outline: 2px solid #0dcaf0; }
    .cat-btn { border-radius: 20px; }
    .cat-btn.active { background: #0dcaf0; border-color: #0dcaf0; color: #111; }
    .prod-card {
      background: #1c1c1c; border: 1px solid #333; border-radius: 12px;
      padding: 12px; cursor: pointer;
    }
    .item-pendiente { color: #ffc107; }
    .item-cocina { color: #0dcaf0; }
    .barra-enviar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #1a1a1a; border-top: 1px solid #333;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    .vista { display: none; }
    .vista.visible { display: block; }
    .login-mesero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #111;
    }
    .login-mesero .form-control {
      background: #1a1a1a;
      color: #fff;
      border-color: #444;
    }
    .login-mesero .form-control::placeholder { color: #888; }
  </style>
</head>
<body>
  <div id="loginMesero" class="login-mesero" style="display: none;">
    <img src="image/logo-ToySoft.png" alt="ToySoft" class="img-fluid mb-3" style="max-width: 96px;">
    <h1 class="h4 text-info mb-1">Mesero</h1>
    <p class="small text-white-50 text-center mb-3">Entra con el correo y la contraseña que te dio Administración. Tu nombre sale en el ticket de cocina.</p>
    <div id="loginMensaje" class="alert alert-danger py-2 px-3 small mb-2 w-100" style="display: none; max-width: 360px;"></div>
    <form class="w-100" style="max-width: 360px;" onsubmit="event.preventDefault(); iniciarSesionMesero();">
      <input type="email" id="usuario" class="form-control form-control-sm mb-2" placeholder="Correo" autocomplete="username" required>
      <input type="password" id="clave" class="form-control form-control-sm mb-3" placeholder="Contraseña" autocomplete="current-password" required>
      <div class="d-grid">
        <button type="submit" class="btn btn-info btn-sm">Iniciar sesión</button>
      </div>
      <div class="mt-2 text-center">
        <button type="button" id="installButton" class="btn btn-outline-warning btn-sm" onclick="installPWA()">
          <i class="fas fa-download me-1"></i>Instalar ToySoft Mesero
        </button>
      </div>
      <p class="small text-white-50 mt-3 mb-0">Si no tienes cuenta, pídesela al administrador.</p>
    </form>
  </div>

  <div id="appMesero" style="display: none;">
  <div class="mesero-top d-flex align-items-center justify-content-between gap-2">
    <div>
      <div class="text-info fw-bold">Mesero</div>
      <div class="small text-muted" id="subtituloMesero">Mesas</div>
    </div>
    <button type="button" class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Salir</button>
  </div>

  <div id="vistaMesas" class="vista visible p-3">
    <div class="input-group mb-3">
      <input type="number" id="nuevaMesaMesero" class="form-control bg-dark text-white border-secondary" placeholder="N° de mesa" min="1">
      <button class="btn btn-info" type="button" onclick="crearMesaMesero()">Abrir mesa</button>
    </div>
    <div id="listaMesasMesero" class="row g-2"></div>
    <p class="text-muted small mt-3 mb-0">Solo mesas. Sin cobros ni inventario. El pedido llega a caja y a cocina.</p>
  </div>

  <div id="vistaPedido" class="vista p-3">
    <button class="btn btn-outline-secondary btn-sm mb-3" type="button" onclick="volverAMesas()"><i class="fas fa-arrow-left me-1"></i>Mesas</button>
    <div id="ordenMesero" class="mb-3"></div>
    <div id="categoriasMesero" class="d-flex flex-wrap gap-2 mb-3"></div>
    <div id="productosMesero" class="d-grid gap-2"></div>
  </div>

  <div class="barra-enviar" id="barraEnviar" style="display: none;">
    <button class="btn btn-info w-100 btn-lg" type="button" onclick="enviarPedidoCocinaMesero()">
      <i class="fas fa-utensils me-1"></i>Enviar a cocina
    </button>
  </div>

  <div class="modal fade" id="modalProductoMesero" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="nombreProductoMesero">Producto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
            <button type="button" class="btn btn-outline-light" onclick="cambiarCantidadMesero(-1)">−</button>
            <input type="number" id="cantidadProductoMesero" class="form-control text-center bg-dark text-white" value="1" min="1" max="99" style="max-width: 80px;">
            <button type="button" class="btn btn-outline-light" onclick="cambiarCantidadMesero(1)">+</button>
          </div>
          <div id="salsasMeseroBox" class="mb-3" style="display: none;">
            <label class="form-label small">Modificaciones</label>
            <div id="salsasMesero"></div>
          </div>
          <div id="opcionesSalsasMeseroBox" class="mb-3" style="display: none;">
            <label class="form-label small">Salsas</label>
            <div id="opcionesSalsasMesero"></div>
          </div>
          <label class="form-label small" for="detalleProductoMesero">Nota</label>
          <textarea id="detalleProductoMesero" class="form-control bg-dark text-white" rows="2" placeholder="Sin cebolla, término medio..."></textarea>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-info w-100" onclick="confirmarProductoMesero()">Agregar</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=25"></script>
  <script src="firebase-init.js?v=25"></script>
  <script src="seguridad.js?v=25"></script>
  <script src="mesero.js?v=25"></script>
  <script src="install.js?v=26"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      if (typeof iniciarPantallaMesero === 'function') iniciarPantallaMesero();
    });
  </script>
</body>
</html>
